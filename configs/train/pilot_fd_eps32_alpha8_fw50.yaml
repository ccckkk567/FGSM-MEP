name: pilot_fd_eps32_alpha8_fw50
deterministic: true
train:
  objective: ours_fd
  backend: mep
  epochs: 40
  epsilon: 32
  alpha: 8
  lr: 0.1
  mep_logit_weight: 10
  feature_weight: 50
  fd_include_mep_logit: true
  monitor_pgd_steps: 10
  monitor_pgd_step_size: 8
  track_features: true
  abort_on_nonfinite: true
