name: paper_evaluation
eval:
  epsilon: 16
  step_size: 2
  attacks: [clean, fgsm, pgd10, pgd20, pgd50, cw20, apgd-t, aa]
  restarts: 1
  # The approved reproduction protocol uses complete attack iterations.
  # See diagnostic_iterative.yaml for the legacy reference-code behavior.
  freeze_misclassified: false
  fgsm_random_start: false
  noise:
    enabled: true
    kind: uniform
    magnitude: 16
    seed: 0
    clip_to_input_range: true
  batch_size: 128
  autoattack_batch_size: 250
